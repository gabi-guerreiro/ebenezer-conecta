<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ebenézer Conecta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,600;1,700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   TOKENS — paleta do Instituto Social Ebenézer, fiel ao color code do
   documento "Plataforma de Evidência Socioemocional".
   ========================================================================== */
:root{
  --brand:#2f7d3b; --brand-d:#1e5c2c; --brand-s:#e7f1e7; --brand-on:#8fcf9b;
  --deep:#16351f; --deep-2:#1e4a2a; --deep-3:#0e2416;
  --surface:#f7f7f2; --surface-alt:#eeefe8; --card:#ffffff; --line:#e3e6de;
  --ink:#16241a; --ink-2:#5c6560; --ink-3:#6d766f;
  --on-deep:#e2eae3; --on-deep-2:#a9bcae;

  --data-1:#2f7d3b; --data-2:#3f6fbd; --data-3:#c2661a;
  --data-4:#8a55c0; --data-5:#b8860b; --data-6:#0a9187;
  --data-1s:#e7f1e7; --data-2s:#e7ecf7; --data-3s:#faeade;
  --data-4s:#f0e8f8; --data-5s:#f8f0d9; --data-6s:#dcf0ee;

  --ok:#2f7d3b; --warn:#b8860b; --bad:#b0332a; --bad-s:#fae4e1;

  --shell-w:480px;
  --shadow-card:0 1px 2px rgba(22,36,26,.05), 0 8px 24px -14px rgba(22,36,26,.18);
  --shadow-float:0 14px 36px -14px rgba(14,36,22,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --brand:#68c97c; --brand-d:#8fdf9d; --brand-s:rgba(47,125,59,.22); --brand-on:#bdeec7;
    --deep:#0b2013; --deep-2:#0f2a17; --deep-3:#081409;
    --surface:#0d1712; --surface-alt:#132019; --card:#152a1e; --line:#24392c;
    --ink:#eef4ee; --ink-2:#adc0b1; --ink-3:#82988a;
    --on-deep:#dfece1; --on-deep-2:#9fc0a5;
    --data-1:#68c97c; --data-2:#84a6e6; --data-3:#e3924f; --data-4:#c298e8; --data-5:#e0bb52; --data-6:#4bd0c4;
    --data-1s:rgba(104,201,124,.15); --data-2s:rgba(132,166,230,.15); --data-3s:rgba(227,146,79,.15);
    --data-4s:rgba(194,152,232,.15); --data-5s:rgba(224,187,82,.15); --data-6s:rgba(75,208,196,.15);
    --ok:#68c97c; --warn:#e0bb52; --bad:#e2776a; --bad-s:rgba(226,119,106,.16);
    --shadow-card:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -14px rgba(0,0,0,.5);
    --shadow-float:0 14px 36px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --brand:#68c97c; --brand-d:#8fdf9d; --brand-s:rgba(47,125,59,.22); --brand-on:#bdeec7;
  --deep:#0b2013; --deep-2:#0f2a17; --deep-3:#081409;
  --surface:#0d1712; --surface-alt:#132019; --card:#152a1e; --line:#24392c;
  --ink:#eef4ee; --ink-2:#adc0b1; --ink-3:#82988a;
  --on-deep:#dfece1; --on-deep-2:#9fc0a5;
  --data-1:#68c97c; --data-2:#84a6e6; --data-3:#e3924f; --data-4:#c298e8; --data-5:#e0bb52; --data-6:#4bd0c4;
  --data-1s:rgba(104,201,124,.15); --data-2s:rgba(132,166,230,.15); --data-3s:rgba(227,146,79,.15);
  --data-4s:rgba(194,152,232,.15); --data-5s:rgba(224,187,82,.15); --data-6s:rgba(75,208,196,.15);
  --ok:#68c97c; --warn:#e0bb52; --bad:#e2776a; --bad-s:rgba(226,119,106,.16);
  --shadow-card:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -14px rgba(0,0,0,.5);
  --shadow-float:0 14px 36px -14px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--surface);color:var(--ink);font-family:Nunito,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5,h6{font-family:Nunito,sans-serif;margin:0;color:var(--ink);text-wrap:balance}
button,input,textarea,select{font-family:inherit}
.tabular{font-variant-numeric:tabular-nums}
a{color:inherit}

#root{min-height:100%;display:flex;justify-content:center;background:var(--surface-alt)}
.shell{width:100%;max-width:var(--shell-w);min-height:100vh;background:var(--surface);position:relative;box-shadow:var(--shadow-float);display:flex;flex-direction:column}

/* ---------- cabeçalho — identidade do Instituto, verde escuro ---------- */
.header{background:linear-gradient(180deg,var(--deep) 0%,var(--deep-2) 100%);padding:14px;display:flex;align-items:center;gap:11px}
.logo-mark{width:38px;height:38px;border-radius:10px;background:var(--brand-on);color:var(--deep-3);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-mark svg{width:21px;height:21px}
.brand-name{font-size:14.5px;font-weight:900;color:#fff;line-height:1.2}
.brand-sub{font-size:10.4px;color:var(--on-deep-2);font-weight:700}
.userbar{background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px 12px;display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-s);color:var(--brand-d);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;border:1.5px solid var(--brand-d);flex-shrink:0}
.userbar .nm{font-weight:900;font-size:13.5px}
.rolepills{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.rolepill{border:1.5px solid var(--ink-3);background:var(--surface-alt);color:var(--ink-2);border-radius:100px;padding:5px 10px 5px 8px;font-size:10.2px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:5px}
.rolepill svg{width:12px;height:12px;flex-shrink:0}
.rolepill.cur{background:var(--brand-d);border-color:var(--brand-d);color:#fff}
.sair{border:1.5px solid var(--bad);background:none;color:var(--bad);font-weight:800;font-size:11px;cursor:pointer;padding:5px 10px;border-radius:100px}

.topbar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px;min-height:40px}
.tb-title{font-size:14.5px;font-weight:900;color:var(--ink);line-height:1.2}
.tb-sub{font-size:10.6px;color:var(--ink-2);font-weight:700}
.tb-back{background:none;border:none;color:var(--brand-d);font-weight:800;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:3px;padding:4px 2px}

.content{flex:1;padding:14px 14px 108px}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px}
.subtab{flex-shrink:0;border:1.5px solid var(--ink-3);background:var(--card);border-radius:100px;padding:7px 12px;font-size:11px;font-weight:800;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.subtab.on{background:var(--brand-d);border-color:var(--brand-d);color:#fff}

/* ---------- bottom nav — fixa na base, sem truncar rótulos ---------- */
.navwrap{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--shell-w);z-index:30}
.bottomnav{background:var(--card);border-top:1px solid var(--line);display:flex;align-items:stretch;padding:6px 2px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px -18px rgba(0,0,0,.25)}
.fab-help{position:absolute;right:14px;bottom:calc(100% + 14px);width:48px;height:48px;border-radius:50%;background:var(--brand-d);color:#fff;border:none;box-shadow:var(--shadow-float);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:31}
.fab-help svg{width:22px;height:22px}
.fab-help:active{transform:scale(.94)}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;background:none;border:none;padding:6px 2px;cursor:pointer;color:var(--ink-2);border-radius:10px;min-width:0}
.navbtn svg{width:19px;height:19px;flex-shrink:0}
.navbtn span{font-size:8.7px;font-weight:800;white-space:normal;line-height:1.15;text-align:center;overflow-wrap:anywhere;max-width:100%}
.bottomnav.compact .navbtn{padding:5px 1px;gap:2px}
.bottomnav.compact .navbtn svg{width:16px;height:16px}
.bottomnav.compact .navbtn span{font-size:7.3px;line-height:1.1}
.navbtn.on{color:var(--brand-d);background:var(--brand-s)}
.navbtn .dot{position:absolute;margin-left:12px;margin-top:-2px;width:7px;height:7px;border-radius:50%;background:var(--bad)}

/* ---------- sheet "mais" ---------- */
.sheet-backdrop{position:fixed;inset:0;background:rgba(10,20,12,.42);z-index:39;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:var(--shell-w);background:var(--card);border-radius:16px 16px 0 0;padding:10px 8px calc(14px + env(safe-area-inset-bottom));box-shadow:var(--shadow-float);max-height:70vh;overflow-y:auto}
.sheet-handle{width:36px;height:4px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet-row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:10px;cursor:pointer;font-weight:800;font-size:13.5px;color:var(--ink)}
.sheet-row:active{background:var(--surface-alt)}
.sheet-row svg{width:20px;height:20px;color:var(--brand-d);flex-shrink:0}

/* ---------- modal genérico (código de acesso) ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(10,20,12,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border-radius:14px;padding:18px;max-width:360px;width:100%;box-shadow:var(--shadow-float)}
.modal h3{font-size:16px;font-weight:900;display:flex;align-items:center;gap:8px}
.modal h3 svg{width:19px;height:19px;color:var(--brand-d);flex-shrink:0}
.modal .x{float:right;background:none;border:1.5px solid var(--ink-3);border-radius:8px;width:26px;height:26px;cursor:pointer;color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.modal .x svg{width:13px;height:13px}
.code-hint{background:var(--brand-s);border-radius:9px;padding:9px 11px;font-size:11px;color:var(--brand-d);font-weight:800;margin:10px 0;display:flex;align-items:center;gap:7px}
.code-hint svg{width:14px;height:14px;flex-shrink:0}
.code-input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px;font-size:22px;letter-spacing:10px;text-align:center;font-weight:900}

/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow-card)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.row>svg{width:16px;height:16px;flex-shrink:0}
.between{justify-content:space-between}
.wrap-row{display:flex;gap:8px;flex-wrap:wrap}
.k{font-size:9.3px;font-weight:900;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase}
.deck{font-size:12.6px;color:var(--ink-2);line-height:1.5}
.hr{height:1px;background:var(--line);border:none;margin:14px 0}

.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;background:var(--brand-d);color:#fff;border:none;border-radius:10px;padding:13px;font-size:13.5px;font-weight:800;cursor:pointer}
.btn svg{width:17px;height:17px;flex-shrink:0}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:not(:disabled):active{transform:scale(.98)}
.btn.ghost{background:var(--surface-alt);border:1.5px solid var(--ink-3);color:var(--ink)}
.btn.gold{background:var(--data-5);color:#3a2a02}
.btn.accent{background:var(--data-2);color:#fff}
.btn.danger{background:var(--bad)}
.btn.link{padding:4px 0;border:none}
.btn.sm{padding:9px;font-size:12px;border-radius:9px}
.subtab-btn{flex-direction:column;gap:6px;padding:14px 6px;font-size:10.8px;line-height:1.25;text-align:center;height:auto}
.subtab-btn svg{width:20px;height:20px}

.opt{background:var(--card);border:1.5px solid var(--ink-3);border-radius:10px;padding:11px 13px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.opt .d{font-size:11px;font-weight:600;color:var(--ink-2)}
.opt.sel{border-color:var(--brand-d);border-width:2px;background:var(--brand-s)}
.opt .row{display:flex;align-items:center;gap:9px}
.opt svg{width:17px;height:17px;flex-shrink:0;color:var(--brand-d)}

.srow{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:9.8px;font-weight:900;padding:4px 9px;border-radius:100px;letter-spacing:.02em;white-space:nowrap}
.pill.ok{background:var(--data-1s);color:var(--ok)}
.pill.warn{background:var(--data-5s);color:var(--warn)}
.pill.bad{background:var(--bad-s);color:var(--bad)}
.pill.muted{background:var(--surface-alt);color:var(--ink-3)}
.pill.info{background:var(--data-2s);color:var(--data-2)}

.field-label{font-size:9.3px;font-weight:900;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;display:block}
textarea,.tinput,select.tinput{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px;font-size:13px;color:var(--ink);background:var(--card);resize:vertical;font-family:inherit}
input[type=search]{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;background:var(--card);color:var(--ink)}
textarea:focus,.tinput:focus,input:focus,button:focus-visible,.navbtn:focus-visible,.opt:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.statcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;cursor:pointer;text-align:left}
.statcard .big{font-family:Nunito;font-size:26px;font-weight:900;color:var(--brand-d);line-height:1}
.statcard .lbl{font-size:9.6px;font-weight:900;letter-spacing:.05em;color:var(--ink-3);text-transform:uppercase;margin-top:4px}
.statcard .sub{font-size:10.6px;color:var(--ink-2);margin-top:5px;line-height:1.4}
.statcard .more{font-size:10.6px;font-weight:800;color:var(--brand-d);margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.roster{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card)}
.roster + .roster{margin-top:8px}
.roster-top{display:flex;gap:10px;align-items:flex-start}
.roster .meta,.card .meta{font-size:10.6px;color:var(--ink-3);margin-top:2px}
.roster .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.chip-tag{font-size:9.6px;font-weight:800;background:var(--surface-alt);color:var(--ink-2);border-radius:100px;padding:3px 8px}
.chip-sel{font-size:10.8px;font-weight:800;background:var(--card);color:var(--ink-2);border:1.5px solid var(--ink-3);border-radius:100px;padding:6px 11px;cursor:pointer}
.chip-sel.on{background:var(--brand-d);border-color:var(--brand-d);color:#fff}
.roster .actions{display:flex;gap:6px;margin-top:9px}

.seg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.seg3 button{border:1.5px solid var(--ink-3);background:var(--card);border-radius:8px;padding:8px 4px;font-size:10.8px;font-weight:800;cursor:pointer;color:var(--ink-2)}
.seg3 button.on-presente{background:var(--data-1s);border-color:var(--data-1);color:var(--ok)}
.seg3 button.on-justificada{background:var(--data-5s);border-color:var(--data-5);color:var(--warn)}
.seg3 button.on-falta{background:var(--bad-s);border-color:var(--bad);color:var(--bad)}

.faces3{display:flex;gap:7px}
.faceopt{flex:1;border:1.5px solid var(--ink-3);background:var(--card);border-radius:9px;padding:9px 4px;text-align:center;font-size:10.4px;font-weight:800;cursor:pointer;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:5px}
.faceopt svg{width:19px;height:19px}
.faceopt.sel{border-width:2px}
.faceopt.sel.on-presente{border-color:var(--data-1);background:var(--data-1s);color:var(--ok)}
.faceopt.sel.on-justificada{border-color:var(--data-5);background:var(--data-5s);color:var(--warn)}
.faceopt.sel.on-falta{border-color:var(--bad);background:var(--bad-s);color:var(--bad)}

.dbritem{border:1.5px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:7px;border-left:4px solid var(--dc,var(--brand))}
.dbritem .tx{font-size:12.4px;font-weight:800;margin-bottom:7px;display:flex;align-items:center;gap:7px}
.dbritem .tx svg{width:16px;height:16px;flex-shrink:0;color:var(--dc,var(--brand-d))}
.tri{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.tri button{border:1.5px solid var(--ink-3);background:var(--card);border-radius:8px;padding:7px 4px;font-size:10.6px;font-weight:800;cursor:pointer;color:var(--ink-2)}
.tri button.on{background:var(--brand-d);border-color:var(--brand-d);color:#fff}

.table-s{width:100%;border-collapse:collapse;font-size:11px}
.table-s th{text-align:left;font-size:9.2px;font-weight:900;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;padding:6px 6px;border-bottom:1px solid var(--line)}
.table-s td{padding:7px 6px;border-bottom:1px solid var(--line);color:var(--ink)}
.table-wrap{overflow-x:auto}

.dimcard{border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--card)}
.dimcard .ic{width:26px;height:26px;border-radius:8px;background:var(--brand-s);display:flex;align-items:center;justify-content:center;color:var(--brand-d)}
.dimcard .ic svg{width:16px;height:16px}
.dimcard .t{font-size:12.4px;font-weight:900;margin-top:7px}
.dimcard .d{font-size:11.2px;color:var(--ink-2);margin-top:3px;line-height:1.4}

.stage3{display:flex;align-items:center;gap:4px;margin:8px 0}
.stage3 .seg{flex:1;text-align:center}
.stage3 .dot2{width:23px;height:23px;border-radius:50%;background:var(--surface-alt);border:2px solid var(--ink-3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:var(--ink-2);margin:0 auto 4px}
.stage3 .dot2 svg{width:12px;height:12px}
.stage3 .seg.done .dot2{background:var(--brand-d);border-color:var(--brand-d);color:#fff}
.stage3 .seg.cur .dot2{background:var(--brand-s);border-color:var(--brand-d);color:var(--brand-d)}
.stage3 .seg .lbl{font-size:9.6px;font-weight:800;color:var(--ink-2)}
.stage3 .seg.done .lbl, .stage3 .seg.cur .lbl{color:var(--ink)}
.stage3 .line{height:2px;background:var(--ink-3);flex:.6;margin-bottom:16px}

.timeline-evt{display:flex;gap:10px}
.timeline-evt .rail{display:flex;flex-direction:column;align-items:center}
.timeline-evt .rdot{width:9px;height:9px;border-radius:50%;background:var(--brand-d);flex-shrink:0;margin-top:4px}
.timeline-evt .rline{width:2px;flex:1;background:var(--line);margin-top:2px}
.timeline-evt .body{padding-bottom:14px;flex:1}
.timeline-evt .when{font-size:10px;font-weight:900;color:var(--ink-3)}
.timeline-evt .what{font-size:12.4px;font-weight:800;margin-top:2px}
.timeline-evt .txt{font-size:11.8px;color:var(--ink-2);margin-top:3px;font-style:italic}

.freqbar{display:flex;gap:2px;flex-wrap:wrap;margin-top:6px}
.freqbar .t{width:9px;height:9px;border-radius:2.5px;background:var(--line)}
.freqbar .t.on{background:var(--data-1)}
.freqbar .t.just{background:var(--data-5)}

.callout{border-radius:10px;padding:11px 13px;font-size:11.8px;line-height:1.55;display:flex;gap:9px;align-items:flex-start}
.callout.info{background:var(--data-2s);color:var(--ink)}
.callout.warn{background:var(--data-5s);color:var(--ink)}
.callout.ok{background:var(--data-1s);color:var(--ink)}
.callout.bad{background:var(--bad-s);color:var(--ink)}
.callout b{font-weight:900}
.callout .ci{flex-shrink:0;margin-top:1px}
.callout .ci svg{width:16px;height:16px}
.callout.info .ci{color:var(--data-2)}
.callout.warn .ci{color:var(--warn)}
.callout.ok .ci{color:var(--ok)}
.callout.bad .ci{color:var(--bad)}
.callout .cb{flex:1;min-width:0}

function stats(){
  const children = DB.children;
  const vinculos = children.flatMap(c=>c.turmas.map(t=>({childId:c.id,turmaId:t})));
  const semInicial = vinculos.filter(v=>{
    const c = children.find(x=>x.id===v.childId);
    if(TURMAS[v.turmaId].presencaOnly) return false;
    if(!c.consentimento) return true;
    return !DB.avaliacoes.some(a=>a.childId===v.childId && a.turmaId===v.turmaId && a.tipo==='inicial');
  });
  const semConsentimento = children.filter(c=>!c.consentimento);
  const aguardando = DB.registros.filter(r=>r.status==='aguardando');
  return {
    criancasUnicas: children.length,
    vinculos: vinculos.length,
    programas: new Set(vinculos.map(v=>v.turmaId)).size,
    semInicial: semInicial.length,
    semConsentimento: semConsentimento.length,
    aguardando: aguardando.length,
    totalRegistros: DB.registros.length,
  };
}
function painelEducador(){
  const st = stats();

    ${ultimos.map(r=>registroCard(r,false)).join('')}

function registroCard(r,withActions){
  const c = DB.children.find(x=>x.id===r.childId);
  const statusPill = r.status==='aguardando' ? `<span class="pill warn">Aguardando revisão</span>`
    : r.status==='validado' ? `<span class="pill ok">Validado pela coordenação</span>`

  const editable = (Date.now() - r.criadoEm) < CORRECAO_MS;
  return `<div class="srow stack" style="gap:6px">
    <div class="row between"><span><span style="font-weight:900;font-size:12.6px;cursor:pointer;text-decoration:underline;text-underline-offset:2px" data-act="goto-child-from-registro" data-id="${r.id}">${c.nome}</span> <span style="font-weight:700;color:var(--ink-2);font-size:10.6px">· ${TURMAS[r.turmaId].nome}</span></span>${statusPill}</div>

    return `<div class="row" style="gap:6px">
      <button class="btn sm" style="flex:1" data-act="validar-registro" data-id="${r.id}">Validar</button>
      <button class="btn ghost sm" style="flex:1" data-act="devolver-registro" data-id="${r.id}">Devolver</button>
    </div>`;
  }
  if(r.status==='validado'){
    return `<button class="btn ghost sm" data-act="goto-child-from-registro" data-id="${r.id}">Ver detalhe · propor intervenção</button>`;
  }
  if(r.status==='devolvido') return `<button class="btn ghost sm" data-act="edit-registro" data-id="${r.id}">Corrigir e reenviar</button>`;
  return editable ? `<button class="btn ghost sm" data-act="edit-registro" data-id="${r.id}">Editar registro</button>` : '';
}

function painelSemaforo(){
  const rows = Object.values(TURMAS).map(t=>{
    const kids = DB.children.filter(c=>c.turmas.includes(t.id));
    const semConsent = kids.filter(k=>!k.consentimento).length;
    const cobertura = kids.length ? Math.round(avg(kids.map(freqConsiderada))*100) : 0;
    let status = 'estavel';
    if(kids.length < 3) status='insuficiente';
    else if(semConsent>0 || cobertura<75) status='atencao';
    return {t,kids,semConsent,cobertura,status};
  });
  return rows.map(r=>`<div class="card" style="border-left:3px solid ${r.status==='estavel'?'var(--data-1)':r.status==='atencao'?'var(--data-5)':'var(--line)'}">
    <div class="row between"><span style="font-weight:900;font-size:13px">${r.t.nome}</span>
      ${r.status==='estavel'?'<span class="pill ok">estável</span>':r.status==='atencao'?'<span class="pill warn">sinal de atenção</span>':'<span class="pill muted">dados insuficientes</span>'}</div>
    <div style="font-size:10.8px;color:var(--ink-2);margin-top:5px">${r.kids.length} educandos vinculados · frequência ${r.cobertura}% (inclui faltas justificadas)${r.semConsent?` · ${r.semConsent} sem consentimento`:''}</div>
  </div>`).join('');
}
function painelEvolucao(){
  const kidsLab = DB.children.filter(c=>c.turmas.includes('lab'));
  const byMonth = {};
  DB.avaliacoes.filter(a=>a.turmaId==='lab').forEach(a=>{
    const m = a.data.slice(0,7);
    (byMonth[m]=byMonth[m]||[]).push(a);
  });
  const months = Object.keys(byMonth).sort();
  const coop = months.map(m=>avg(byMonth[m].map(a=>a.respostas.ajudou==='sim'?1:0)));
  const part = months.map(m=>Math.round(avg(byMonth[m].map(a=>a.respostas.participou==='sim'?1:0))*100));
  const n = months.map(m=>byMonth[m].length);
  return `<div class="card chart-card">
    <div class="legend"><span><i style="background:var(--data-6)"></i>taxa de "ajudou sem pedir"</span><span><i style="background:var(--data-1)"></i>participação sustentada (%)</span></div>
    ${months.length ? trajSvg(months.map(fmtMesISO), n, coop.map(v=>v*4), part) : `<div class="empty">Sem avaliações suficientes no Laboratório de Sonhos ainda.</div>`}
    <div style="font-size:10.5px;color:var(--ink-2);margin-top:6px">Variação é contexto, não causa provada.</div>
  </div>`;
}

function ivCard(iv){

      ? callout('ok', `<b>Resultado observado e validado</b><br>"${iv.resultado}"`)

function stage3Html(estagio){
  const labels=['Proposta','Acompanhamento','Validado'];
  return `<div class="stage3">${labels.map((l,i)=>{
    const n=i+1; const done = n<estagio || (n===3 && estagio===3); const cur = n===estagio && estagio<3;

  }).join('')}</div>`;
}

function dimStatus(childId, dimId){
  const avs = DB.avaliacoes.filter(a=>a.childId===childId).sort((a,b)=>a.data.localeCompare(b.data));
  if(avs.length<1) return {status:'—', desc:'Sem avaliação registrada ainda.'};
  const dim = DIMENSOES.find(d=>d.id===dimId);
  const score = a => avg(dim.itens.map(i=>a.respostas[i.k]==='sim'?1:a.respostas[i.k]==='nao'?0:null).filter(v=>v!==null));
  const first = score(avs[0]); const last = score(avs[avs.length-1]);
  if(avs.length===1 || first===last) return {status:'Estável', desc:'Mantém o padrão observado desde a avaliação inicial.'};
  return last>first ? {status:'Avanço', desc:'Mais frases marcadas como "sim" desde a avaliação inicial.'} : {status:'Atenção', desc:'Menos frases marcadas como "sim" desde a avaliação inicial — vale observar de perto.'};
}
function escalaAutonomia(childId){
  const validados = DB.registros.filter(r=>r.childId===childId && r.status==='validado').length + DB.avaliacoes.filter(a=>a.childId===childId).length;
  return validados>=5 ? 3 : validados>=2 ? 2 : 1;
}
function leituraTrajetoria(childId){
  const avs = DB.avaliacoes.filter(a=>a.childId===childId).sort((a,b)=>a.data.localeCompare(b.data));
  const validados = DB.registros.filter(r=>r.childId===childId && r.status==='validado').length;
  if(avs.length<2) return `Apenas ${avs.length} avaliação(ões) registrada(s) — base pequena para afirmar tendência.`;
  const first = avs[0], last = avs[avs.length-1];
  let avanco=0, manteve=0, regrediu=0, semPar=0;
  ALL_ITEMS.forEach(i=>{
    const a = first.respostas[i.k], b = last.respostas[i.k];
    if(a===undefined || b===undefined || a==='nao_observei' || b==='nao_observei'){ semPar++; return; }
    if(a==='nao' && b==='sim') avanco++;
    else if(a==='sim' && b==='nao') regrediu++;
    else manteve++;
  });
  return `Entre ${fmtDataCurta(first.data)} e ${fmtDataCurta(last.data)}, ${avanco} frase(s) passaram de "não" para "sim", ${manteve} mantiveram e ${regrediu} regrediram (${semPar} sem dado pareado). São ${avs.length} avaliações e ${validados} registros validados — base ${avs.length>=3&&validados>=2?'adequada':'pequena'} para afirmar tendência.`;
}
function screenChild(childId){
  const c = DB.children.find(x=>x.id===childId);

    .concat(c.turmas.map(t=>({data:c.entrada, tipo:'Entrada', turma:t, txt:`Entrou em ${TURMAS[t].nome}`})))

  return `<div class="stack">
    <div class="card">
      <div class="roster-top">
        <div class="avatar" style="width:44px;height:44px;font-size:14px">${initials(c.nome)}</div>
        <div>
          <div style="font-weight:900;font-size:15px">${c.nome}</div>
          <div class="meta">${c.idade} anos · ${c.id} · nasc. ${fmtDataCurta(c.nasc)}</div>
          <div class="meta">Responsável: ${c.resp.nome} (${c.resp.rel})</div>
          ${S.role==='psicologa' ? `<div class="meta">Contato: ${c.resp.contato} · Instituto Social Ebenézer · Jardim Ângela</div>` : ''}
          <div class="chips">${c.turmas.map(t=>`<span class="chip-tag">${TURMAS[t].nome}</span>`).join('')}</div>
        </div>
      </div>
      <button class="btn ghost sm" style="margin-top:10px" data-act="novo-obs-child" data-child="${c.id}">+ Nova observação</button>
      ${S.role==='coordenacao' || S.role==='psicologa' ? `<button class="btn ghost sm" style="margin-top:8px" data-act="goto-propor" data-child="${c.id}">${icoBolt()} Propor intervenção</button>` : ''}
    </div>
    ${S.role==='psicologa' ? casoClinicoBlock(childId) : ''}
    <div class="grid2">
      <div class="srow" style="text-align:center"><div class="tabular" style="font-size:18px;font-weight:900">${registros.length}</div><div class="k">Registros na trajetória</div></div>
      <div class="srow" style="text-align:center"><div style="font-size:13px;font-weight:900">${ultimo?fmtDataCurta(ultimo.data):'—'}</div><div class="k">Último acompanhamento</div></div>
      <div class="srow" style="text-align:center"><div class="tabular" style="font-size:18px;font-weight:900">${ivs.filter(i=>i.estagio<3).length}</div><div class="k">Intervenções em andamento</div></div>
      <div class="srow" style="text-align:center"><div class="tabular" style="font-size:18px;font-weight:900">${ivs.filter(i=>i.estagio===3).length}</div><div class="k">Intervenções concluídas</div></div>
    </div>
    <div class="k">Síntese visual da trajetória</div>
    <div class="grid2">
      ${DIMENSOES.slice(0,4).map(d=>{ const r = dimStatus(childId,d.id); return `<div class="dimcard"><div class="ic">${d.ic}</div><div class="t">${d.nome}</div><span class="pill ${r.status==='Avanço'?'ok':r.status==='Atenção'?'warn':'muted'}" style="margin-top:5px">${r.status}</span><div class="d">${r.desc}</div></div>`; }).join('')}
    </div>
    <div class="card">
      <div class="k">Escala pedagógica de autonomia</div>
      <div style="font-size:11px;color:var(--ink-3);margin:3px 0 2px">Fase atual: ${stageLbl[escala-1]}</div>
      ${stage3Html(escala===3?3:escala)}
    </div>
    ${callout('info', `<b>Leitura da trajetória</b> · contagem, não diagnóstico<br>${leituraTrajetoria(childId)}`)}
    <div class="k">Frequência por turma</div>
    ${c.turmas.map(t=>`<div class="srow"><div class="row between"><span style="font-weight:800;font-size:12px">${TURMAS[t].nome}</span><span class="tabular" style="font-weight:900">${c.freq.p}/${c.freq.t} · ${Math.round(freqConsiderada(c)*100)}% considerada</span></div>
      <div class="freqbar">${Array.from({length:c.freq.t}).map((_,i)=>`<span class="t ${i<c.freq.p?'on':i<c.freq.p+c.freq.j?'just':''}"></span>`).join('')}</div>
      ${c.freq.j?`<div style="font-size:10.2px;color:var(--ink-2);margin-top:5px">${c.freq.j} falta(s) justificada(s) não contam para o sinal de atenção</div>`:''}
      ${faltaRecorrente(c)?`<div style="font-size:10.2px;color:var(--warn);font-weight:800;margin-top:2px">Recorrência de falta justificada — observar vulnerabilidade</div>`:''}
      </div>`).join('')}
    <div class="k">Evidências e intervenções · ${events.length} eventos</div>

  </div>`;
}

/* ==========================================================================
   GRÁFICO DE TRAJETÓRIA (reaproveitado)
   ========================================================================== */
function trajSvg(meses,n,coop,part){
  const W=560,H=180,padL=32,padR=12,padT=12,padB=28;
  const maxCoop = Math.max(4, ...coop);
  const xs = meses.map((_,i)=> meses.length>1 ? padL + i*((W-padL-padR)/(meses.length-1)) : W/2);
  const yCoop = v => padT + (H-padT-padB) * (1 - v/maxCoop);
  const yPart = v => padT + (H-padT-padB) * (1 - v/100);
  const ptsCoop = xs.map((x,i)=>`${x.toFixed(1)},${yCoop(coop[i]).toFixed(1)}`).join(' ');
  const ptsPart = xs.map((x,i)=>`${x.toFixed(1)},${yPart(part[i]).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Nunito, sans-serif">
    <g stroke="var(--line)">${[0,1,2,3].map(i=>`<line x1="${padL}" y1="${padT+i*(H-padT-padB)/3}" x2="${W-padR}" y2="${padT+i*(H-padT-padB)/3}"/>`).join('')}</g>
    <polyline points="${ptsCoop}" fill="none" stroke="var(--data-6)" stroke-width="2.5" stroke-linecap="round"/>
    <polyline points="${ptsPart}" fill="none" stroke="var(--data-1)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/>
    ${xs.map((x,i)=>`<circle cx="${x}" cy="${yCoop(coop[i])}" r="4" fill="var(--data-6)"/>`).join('')}
    ${xs.map((x,i)=>`<circle cx="${x}" cy="${yPart(part[i])}" r="3.5" fill="var(--data-1)"/>`).join('')}
    ${xs.map((x,i)=>`<text x="${x}" y="${H-10}" font-size="9.5" fill="var(--ink-3)" text-anchor="middle">${meses[i]}</text>`).join('')}
    ${xs.map((x,i)=>`<text x="${x}" y="${H-1}" font-size="8.5" fill="var(--ink-3)" text-anchor="middle">n=${n[i]}</text>`).join('')}
  </svg>`;
}

/* ==========================================================================
   HELPERS
   ========================================================================== */
function avg(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0; }
// Regra de negócio (validada com a coordenação): falta justificada é registrada pela própria
// educadora e não conta contra a criança — o sinal de atenção usa presença + justificadas.
// Recorrência de faltas justificadas (>=3) é observada à parte, como possível vulnerabilidade.
function freqConsiderada(k){ return k.freq.t ? (k.freq.p + k.freq.j) / k.freq.t : 0; }
function freqBruta(k){ return k.freq.t ? k.freq.p / k.freq.t : 0; }
function freqQual(k){ const f = freqConsiderada(k); return f>=.75 ? 'boa' : f>=.5 ? 'média' : 'baixa'; }
function faltaRecorrente(k){ return k.freq.j>=3; }
function initials(name){ return (name||'').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function fmtData(iso){ const d=new Date(iso+'T12:00:00'); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'}); }
function fmtDataCurta(iso){ const d=new Date(iso+'T12:00:00'); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtMesISO(iso){ const d=new Date(iso+'-01T12:00:00'); return d.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''); }
function diffDias(dataISO, tsCriado){ const a = Date.parse(dataISO+'T12:00:00'); return Math.max(0,Math.round((tsCriado-a)/86400000)); }
function diffDiasHoje(dataISO){ const hoje = Date.parse(HOJE+'T12:00:00'); const a = Date.parse(dataISO+'T12:00:00'); return Math.max(0,Math.round((hoje-a)/86400000)); }

/* ==========================================================================
   AÇÕES
   ========================================================================== */
// Campos de texto livre atualizam o estado a cada tecla SEM re-renderizar a tela.
// (Antes, o re-render no evento "change" disparado pelo blur engolia o clique no botão de enviar.)
const LIVE = {
  'novo-texto':'novoTexto','propor-acao-livre':'ivAcaoLivre','propor-objetivo-livre':'ivObjetivoLivre',
  'propor-obs-texto':'ivObs','caso-descricao':'casoDescricao','caso-objetivo':'casoObjetivo',
  'at-objetivo':'atObjetivo','at-procedimentos':'atProcedimentos','at-evolucao':'atEvolucao','at-demandas':'atDemandas',
  'at-enc-paraquem':'atEncParaQuem','at-enc-motivo':'atEncMotivo','frase-edit-text':'fraseTextoTmp',
};
function liveInput(act, el){
  if(act==='code-input'){ el.value = el.value.replace(/\D/g,'').slice(0,4); S.codeVal = el.value; }
  else { S.ctx[LIVE[act]] = el.value; }
  refreshGates();
}
function setDis(sel, off){ const b = root().querySelector(sel); if(b) b.disabled = !!off; }
function refreshGates(){
  const t = k => (S.ctx[k]||'').trim().length;
  setDis('[data-act=confirm-code]', (S.codeVal||'').length!==4);
  setDis('[data-act=novo-submit]', t('novoTexto')<=8);
  if(S.ctx.ivAcaoSel!=null) setDis('[data-act=propor-submit]', S.ctx.ivAcaoSel==='outra' && (t('ivAcaoLivre')<=4 || t('ivObjetivoLivre')<=4));
  setDis('[data-act=caso-abrir-submit]', !((S.ctx.casoTipos||[]).length && t('casoObjetivo')>4));
  setDis('[data-act=caso-atividade-submit]', !(S.ctx.atTipo && t('atEvolucao')>4));
  const w = document.getElementById('novoWarn'); const c = DB.children.find(x=>x.id===S.ctx.novoChild);
  if(w && c) w.innerHTML = novoRegistroWarning(c);
}
function bind(){
  root().querySelectorAll('[data-act]').forEach(el=>{
    const act = el.dataset.act;
    if(LIVE[act] || act==='code-input'){ el.addEventListener('input', ()=>liveInput(act, el)); return; }
    const isFormEl = el.tagName==='SELECT' || (el.tagName==='INPUT' && el.type!=='checkbox') || el.tagName==='TEXTAREA';
    const evt = isFormEl ? 'change' : (el.type==='checkbox' ? 'change' : 'click');
    el.addEventListener(evt, (e)=>{ e.stopPropagation(); handle(act, el, e); });
  });
}
function ctx(patch){ S.ctx = Object.assign({}, S.ctx, patch); }

function handle(act, el){
  switch(act){
    case 'pick-role':
      S.role = el.dataset.role; S.tab = NAV[S.role].primary[0][0]; S.sub=null; S.ctx={}; render(); break;
    case 'logout':
      S.role = null; S.tab=null; S.sub=null; S.ctx={}; S.codeModal=null; S.codeVal=''; render(); break;
    case 'open-code':
      S.codeModal = el.dataset.role; S.codeVal=''; render(); break;
    case 'close-code':
      S.codeModal = null; S.codeVal=''; render(); break;
    case 'code-input':
      S.codeVal = el.value.replace(/\D/g,'').slice(0,4); render(); break;
    case 'biometria-sim': {
      S.role = S.codeModal; S.tab = NAV[S.role].primary[0][0]; S.sub=null; S.ctx={}; S.codeModal=null; S.codeVal=''; render(); break;
    }
    case 'confirm-code': {
      const need = USERS[S.codeModal].code;
      if(S.codeVal===need){ S.role = S.codeModal; S.tab = NAV[S.role].primary[0][0]; S.sub=null; S.ctx={}; S.codeModal=null; S.codeVal=''; render(); }
      else { alert('Código incorreto. Use o código de demonstração exibido acima.'); }
      break;
    }
    case 'nav':
      S.tab = el.dataset.tab; S.sub=null; S.ctx={}; S.sheetOpen=false; S.tutorialOpen=false; render(); break;
    case 'open-sheet': S.sheetOpen = true; render(); break;
    case 'close-sheet': S.sheetOpen = false; render(); break;
    case 'open-tutorial': S.tutorialOpen = true; render(); break;
    case 'close-tutorial': S.tutorialOpen = false; render(); break;
    case 'sub-back': S.sub=null; S.ctx={}; render(); break;
    // Fora do painel inicial, "Voltar" leva de volta ao painel do perfil.
    case 'tab-back': S.tab=NAV[S.role].primary[0][0]; S.sub=null; S.ctx={}; S.sheetOpen=false; render(); break;

    case 'painel-sub': ctx({painelSub:el.dataset.sub}); render(); break;

    case 'goto-child': S.sub='child'; S.ctx={childId:el.dataset.child}; render(); break;
    case 'goto-child-from-registro': { const r = DB.registros.find(x=>x.id===el.dataset.id); S.sub='child'; S.ctx={childId:r.childId}; render(); break; }
    case 'goto-avaliar': S.sub='avaliar'; S.ctx={childId:el.dataset.child}; render(); break;
    case 'goto-novoregistro': S.sub='novoregistro'; S.ctx={}; render(); break;
    case 'novo-obs-child': S.sub='novoregistro'; S.ctx={novoChild:el.dataset.child}; render(); break;
    case 'goto-propor-tab': S.sub='propor'; S.ctx={}; render(); break;
    case 'goto-propor': S.sub='propor'; S.ctx={ivChild:el.dataset.child}; render(); break;

    /* prontuário psicológico — caso clínico */
    case 'goto-caso-novo': S.sub='casonovo'; S.ctx={casoChild:el.dataset.child, casoTipos:[]}; render(); break;
    case 'goto-caso-atividade': S.sub='casoatividade'; S.ctx={casoChild:el.dataset.child}; render(); break;
    case 'caso-tipo-toggle': { const arr = (S.ctx.casoTipos||[]).slice(); const i = arr.indexOf(el.dataset.t); if(i>-1) arr.splice(i,1); else arr.push(el.dataset.t); ctx({casoTipos:arr}); render(); break; }
    case 'caso-descricao': ctx({casoDescricao:el.value}); render(); break;
    case 'caso-objetivo': ctx({casoObjetivo:el.value}); render(); break;
    case 'caso-abrir-submit': submitCasoNovo(); break;
    case 'caso-toggle-status': { const caso = DB.casos.find(k=>k.childId===el.dataset.child); caso.status = caso.status==='ativo' ? 'encerrado' : 'ativo'; logAudit(`${USERS[S.role].nome} ${caso.status==='ativo'?'reabriu':'encerrou'} o caso de ${DB.children.find(c=>c.id===el.dataset.child).nome}.`); saveDB(); render(); break; }
    case 'at-data': ctx({atData:el.value}); render(); break;
    case 'at-tipo': ctx({atTipo:el.value}); render(); break;
    case 'at-objetivo': ctx({atObjetivo:el.value}); render(); break;
    case 'at-procedimentos': ctx({atProcedimentos:el.value}); render(); break;
    case 'at-evolucao': ctx({atEvolucao:el.value}); render(); break;
    case 'at-demandas': ctx({atDemandas:el.value}); render(); break;
    case 'at-enc-toggle': ctx({atEncaminhamento:el.checked}); render(); break;
    case 'at-enc-paraquem': ctx({atEncParaQuem:el.value}); render(); break;
    case 'at-enc-motivo': ctx({atEncMotivo:el.value}); render(); break;
    case 'at-enc-retorno': ctx({atEncRetorno:el.dataset.v}); render(); break;
    case 'caso-atividade-submit': submitCasoAtividade(); break;

    /* stats/painel */
    case 'aval-q': ctx({avalQ:el.value}); render(); break;
    case 'aval-turma': ctx({avalTurma:el.value}); render(); break;
    case 'aval-seminicial': ctx({avalSemInicial:el.checked}); render(); break;

    /* presença */
    case 'pres-turma': ctx({presTurma:el.value, presData:null}); render(); break;
    case 'pres-data': ctx({presData:el.value}); render(); break;
    case 'pres-clima': { const {turmaId,data,key,rec} = presCtx(); rec.clima = el.dataset.v; DB.presencas[key]=rec; saveDB(); render(); break; }
    case 'pres-mark': { const {rec,key} = presCtx(); rec.marks[el.dataset.child] = el.dataset.v; DB.presencas[key]=rec; saveDB(); render(); break; }
    case 'pres-marcar-todos': { const {turmaId,rec,key} = presCtx(); DB.children.filter(c=>c.turmas.includes(turmaId)).forEach(c=>rec.marks[c.id]='presente'); DB.presencas[key]=rec; saveDB(); render(); break; }
    case 'pres-fechar': { const {rec,key} = presCtx(); rec.fechado = true; DB.presencas[key]=rec; saveDB(); render(); break; }
    case 'pres-reabrir': { const {rec,key} = presCtx(); rec.fechado = false; DB.presencas[key]=rec; saveDB(); render(); break; }

    /* avaliação individual */
    case 'aval-data-form': ctx({avalData:el.value}); render(); break;
    case 'aval-atencao': ctx({avalAtencao:el.checked}); render(); break;
    case 'aval-modo': ctx({avalModo:el.dataset.v, avalRespostas:{}}); render(); break;
    case 'aval-resp': { const r = Object.assign({}, S.ctx.avalRespostas); r[el.dataset.k]=el.dataset.v; ctx({avalRespostas:r}); render(); break; }
    case 'aval-submit': submitAvaliacao(); break;
    case 'registrar-consentimento': { const c = DB.children.find(x=>x.id===el.dataset.child); c.consentimento=true; logAudit(`${USERS[S.role].nome} registrou consentimento do responsável para ${c.nome} (${c.id}).`); saveDB(); render(); break; }

    /* registros / novo registro */
    case 'reg-filtro': ctx({regFiltro:el.dataset.f}); render(); break;
    case 'novo-q': ctx({novoQ:el.value}); render(); break;
    case 'novo-pick-child': ctx({novoChild:el.dataset.child, novoQ:''}); render(); break;
    case 'novo-data': ctx({novoData:el.value}); render(); break;
    case 'novo-metodo': ctx({novoMetodo:el.dataset.v}); render(); break;
    case 'novo-texto': ctx({novoTexto:el.value}); render(); break;
    case 'toggle-rec': S.rec = !S.rec; render(); break;
    case 'novo-submit': submitRegistro(); break;
    case 'validar-registro': { const r = DB.registros.find(x=>x.id===el.dataset.id); r.status='validado'; logAudit(`${USERS[S.role].nome} validou o registro de ${DB.children.find(c=>c.id===r.childId).nome}.`); saveDB(); render(); break; }
    case 'devolver-registro': { const r = DB.registros.find(x=>x.id===el.dataset.id); const motivo = prompt('Motivo da devolução:', 'Reescrever descrevendo o comportamento observado, sem interpretar o motivo.'); if(motivo===null) return; r.status='devolvido'; r.motivo=motivo; logAudit(`${USERS[S.role].nome} devolveu o registro de ${DB.children.find(c=>c.id===r.childId).nome} — motivo: ${motivo}`); saveDB(); render(); break; }
    case 'edit-registro': { const r = DB.registros.find(x=>x.id===el.dataset.id); const novo = prompt('Editar registro:', r.texto); if(novo===null||!novo.trim()) return; r.texto=novo.trim(); if(r.status==='devolvido'){ r.status='aguardando'; r.motivo=null; logAudit(`${USERS[S.role].nome} corrigiu e reenviou o registro de ${DB.children.find(c=>c.id===r.childId).nome}.`); } saveDB(); render(); break; }

    /* intervenções */
    case 'iv-filtro': ctx({ivFiltro:el.dataset.f}); render(); break;
    case 'iv-avancar': { const iv = DB.intervencoes.find(x=>x.id===el.dataset.id); iv.estagio=2; logAudit(`${USERS[S.role].nome} iniciou o acompanhamento da intervenção de ${DB.children.find(c=>c.id===iv.childId).nome}.`); saveDB(); render(); break; }
    case 'iv-registrar': { const iv = DB.intervencoes.find(x=>x.id===el.dataset.id); const res = prompt('Resultado observado:'); if(res===null||!res.trim()) return; iv.resultado=res.trim(); iv.estagio=3; logAudit(`${USERS[S.role].nome} validou o resultado da intervenção de ${DB.children.find(c=>c.id===iv.childId).nome}.`); saveDB(); render(); break; }

    /* propor intervenção */
    case 'propor-q': ctx({ivQ:el.value}); render(); break;
    case 'propor-pick-child': ctx({ivChild:el.dataset.child}); render(); break;
    case 'propor-acao': ctx({ivAcaoSel:el.dataset.v}); render(); break;
    case 'propor-acao-livre': ctx({ivAcaoLivre:el.value}); render(); break;
    case 'propor-objetivo-livre': ctx({ivObjetivoLivre:el.value}); render(); break;
    case 'propor-metodo': ctx({ivMetodo:el.dataset.v}); render(); break;
    case 'propor-obs-texto': ctx({ivObs:el.value}); break;
    case 'propor-submit': submitPropor(); break;

    /* educandos */
    case 'edu-q': ctx({eduQ:el.value}); render(); break;

    /* encaminhamentos */
    case 'enc-filtro': ctx({encFiltro:el.dataset.f}); render(); break;
    case 'enc-revisar': { const e = DB.encaminhamentos.find(x=>x.id===el.dataset.id); e.status='revisado'; logAudit(`${USERS[S.role].nome} marcou como revisado o encaminhamento de ${DB.children.find(c=>c.id===e.childId).nome}.`); saveDB(); render(); break; }

    /* frases */
    case 'frase-editar': ctx({editFrase:el.dataset.k}); render(); break;
    case 'frase-cancelar': ctx({editFrase:null}); render(); break;
    case 'frase-edit-text': ctx({fraseTextoTmp:el.value}); break;
    case 'frase-salvar': { const f = DB.frases.find(x=>x.k===el.dataset.k); if(S.ctx.fraseTextoTmp) f.t = S.ctx.fraseTextoTmp; f.versao++; f.atualizadoEm=HOJE; ctx({editFrase:null, fraseTextoTmp:null}); saveDB(); render(); break; }

    /* relatório */
    case 'rep-turma': ctx({repTurma:el.value}); render(); break;
    case 'rep-tipo': ctx({repTipo:el.dataset.t}); render(); break;

    case 'reset-demo':
      if(!confirm('Apagar tudo que foi lançado neste navegador e voltar aos dados de demonstração?')) return;
      resetDB(); S.role=null; S.tab=null; S.sub=null; S.ctx={}; render(); break;
    case 'noop': break;
  }
}
function presCtx(){
  const turmaId = S.ctx.presTurma || 'lab';
  const data = S.ctx.presData || HOJE;
  const key = presKey(turmaId,data);
  let rec = DB.presencas[key];
  if(!rec){ rec = {clima:null, fechado:false, marks:{}}; DB.presencas[key]=rec; }
  return {turmaId,data,key,rec};
}
function logAudit(texto){ DB.auditLog.push({ts:Date.now(), texto}); }

function submitAvaliacao(){
  const childId = S.ctx.childId;
  const c = DB.children.find(x=>x.id===childId);
  const turmaId = S.ctx.avalTurmaSel || c.turmas.find(t=>!TURMAS[t].presencaOnly);
  const jaTemInicial = DB.avaliacoes.some(a=>a.childId===childId && a.turmaId===turmaId && a.tipo==='inicial');
  const av = {id:uid('av'), childId, turmaId, data:S.ctx.avalData||HOJE, tipo: jaTemInicial?'checkin':'inicial', modo:S.ctx.avalModo, autor:USERS[S.role].nome, respostas:Object.assign({},S.ctx.avalRespostas), atencaoPsicologa:!!S.ctx.avalAtencao};
  DB.avaliacoes.push(av);
  if(av.atencaoPsicologa){ DB.encaminhamentos.push({id:uid('en'), childId, turmaId, data:av.data, status:'pendente'}); }
  logAudit(`${av.autor} registrou ${av.tipo==='inicial'?'avaliação inicial':'check-in'} (modo ${av.modo}) de ${c.nome}${av.atencaoPsicologa?' e sinalizou atenção da psicóloga':''}.`);
  saveDB();
  S.sub=null; S.ctx={}; S.tab='avaliacoes'; render();
}
function submitRegistro(){
  const childId = S.ctx.novoChild;
  const r = {id:uid('r'), childId, turmaId:DB.children.find(c=>c.id===childId).turmas[0], data:S.ctx.novoData||HOJE,
    criadoEm:Date.now(), autor:USERS[S.role].nome, metodo:S.ctx.novoMetodo, texto:(S.ctx.novoTexto||'').trim(), status:'aguardando'};
  DB.registros.push(r);
  logAudit(`${r.autor} enviou um registro de ${DB.children.find(c=>c.id===childId).nome} para revisão.`);
  saveDB();
  S.sub=null; S.ctx={}; S.tab='registros'; render();
}
function submitPropor(){
  const childId = S.ctx.ivChild;
  const c = DB.children.find(x=>x.id===childId);
  const isCustom = S.ctx.ivAcaoSel==='outra';
  const modelo = isCustom ? null : PROPOSTAS_MODELO[Number(S.ctx.ivAcaoSel)];
  const iv = {
    id:uid('iv'), childId, turmaId:c.turmas.find(t=>!TURMAS[t].presencaOnly) || c.turmas[0],
    acao: isCustom ? S.ctx.ivAcaoLivre.trim() : modelo.acao,
    objetivo: isCustom ? S.ctx.ivObjetivoLivre.trim() : modelo.objetivo,
    propostoPor:USERS[S.role].nome, propostoEm:HOJE, estagio:1, resultado:null,
    observacao:(S.ctx.ivObs||'').trim() || null, metodo:S.ctx.ivMetodo || null,
  };
  DB.intervencoes.push(iv);
  logAudit(`${USERS[S.role].nome} propôs uma intervenção para ${c.nome}.`);
  saveDB();
  S.sub='child'; S.ctx={childId}; render();
}
function submitCasoNovo(){
  const childId = S.ctx.casoChild;
  const caso = {
    id:uid('caso'), childId, tipos:(S.ctx.casoTipos||[]).slice(),
    descricao:(S.ctx.casoDescricao||'').trim(), objetivo:S.ctx.casoObjetivo.trim(),
    status:'ativo', criadoEm:HOJE, atividades:[],
  };
  DB.casos.push(caso);
  logAudit(`${USERS[S.role].nome} abriu um caso clínico para ${DB.children.find(c=>c.id===childId).nome}.`);
  saveDB();
  S.sub='child'; S.ctx={childId}; render();
}
function submitCasoAtividade(){
  const childId = S.ctx.casoChild;
  const caso = DB.casos.find(k=>k.childId===childId);
  const at = {
    id:uid('at'), data:S.ctx.atData||HOJE, profissional:USERS[S.role].nome, tipo:S.ctx.atTipo,
    objetivoAtividade:(S.ctx.atObjetivo||'').trim(), procedimentos:(S.ctx.atProcedimentos||'').trim(),
    evolucao:(S.ctx.atEvolucao||'').trim(), demandas:(S.ctx.atDemandas||'').trim(),
    encaminhamento: S.ctx.atEncaminhamento ? {
      paraQuem:(S.ctx.atEncParaQuem||'').trim(), motivo:(S.ctx.atEncMotivo||'').trim(),
      data:S.ctx.atData||HOJE, responsavel:USERS[S.role].nome, retorno:S.ctx.atEncRetorno||'aguardando',
    } : null,
  };
  caso.atividades.push(at);
  logAudit(`${USERS[S.role].nome} registrou uma atividade (${at.tipo}) para ${DB.children.find(c=>c.id===childId).nome}.`);
  saveDB();
  S.sub='child'; S.ctx={childId}; render();
}

render();
</script>
